plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'com.github.ben-manes.versions'
    id 'maven-publish'
}

group = project.groupId
version = project.version

java {
    var version = JavaVersion.VERSION_21

    sourceCompatibility = version
    targetCompatibility = version
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.jetbrains:annotations:${project.jetbrainsAnnotationsVersion}"

    testImplementation platform("org.junit:junit-bom:${project.junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

spotless {
    java {
        eclipse().configFile("eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

jacoco {
    toolVersion = project.jacocoVersion
}

build {
    dependsOn spotlessApply
}

tasks.register('generateFunctions', JavaExec) {
    group = 'codegen'
    description = 'Generate Function2-16 interfaces'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.just.core.internal.codegen.FunctionGenerator')
    args 'src/main/java'
}

tasks.register('generateMemos', JavaExec) {
    group = 'codegen'
    description = 'Generate Memo3-16 types'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.just.core.internal.codegen.MemoGenerator')
    args 'src/main/java'
}

tasks.register('generatePredicates', JavaExec) {
    group = 'codegen'
    description = 'Generate Predicate2-16 interfaces'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.just.core.internal.codegen.PredicateGenerator')
    args 'src/main/java'
}

tasks.register('generateTuples', JavaExec) {
    group = 'codegen'
    description = 'Generate Tuple2–16 records into src/main/java'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.just.core.internal.codegen.TupleGenerator')
    args 'src/main/java'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport, jacocoTestCoverageVerification

    reports {
        junitXml.required = false
        html.required = true
    }

    testLogging {
        exceptionFormat = 'full'
        showStackTraces = true
        events 'failed'
    }
}

jacocoTestReport {
    dependsOn test
    outputs.upToDateWhen { false }

    reports {
        csv.required = false
        xml.required = false
        html.required = true
    }

    classDirectories.setFrom(files(classDirectories.files.collect { dir ->
        fileTree(dir) {
            exclude(
                "${project.group.toString().replace('.', '/')}/**/internal",
            )
        }
    }))

    doLast {
        def htmlReportDir = reports.html.outputLocation.get().asFile
        if (htmlReportDir.exists()) {
            logger.lifecycle("The JaCoCo test report is available here: file://${htmlReportDir}/index.html")
        } else {
            logger.lifecycle("JaCoCo HTML report was not generated.")
        }
    }
}


jacocoTestCoverageVerification {
    violationRules {
        rule {
            classDirectories.setFrom(jacocoTestReport.classDirectories)

            limit {
                minimum = 0.8
            }
        }

        rule {
            element = 'CLASS'

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'Just'
            url = uri(project.mavenUrl)

            credentials {
                username = System.getenv("JUST_MAVEN_USERNAME")
                password = System.getenv("JUST_MAVEN_PASSWORD")
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        maven(MavenPublication) {
            groupId = project.groupId
            artifactId = project.artifactId
            version = project.version

            from components.java
        }
    }
}